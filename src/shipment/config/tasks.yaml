carrier_selection_task:
  description: >
    Analyze the shipment requirements and suggest the best carrier.
  expected_output: >
    A recommendation of which carrier to use and why.

booking_task:
  description: >
    Execute the booking for the planned shipment.
  expected_output: >
    Confirmation of booking and a generated tracking ID.

tracking_task:
  description: >
    IMPORTANT: You must track the SPECIFIC ID provided by the user: {tracking_id}. 
    Do NOT track any IDs generated in previous booking steps. 
    Use the `track_shipment_eshipz` tool only for {tracking_id}.
    STRICTLY FORBIDDEN: Do not hallucinate, guess, or simulate any locations or tracking events.
    If the API returns [], you MUST report EXACTLY: "Integration Successful: No records found in the carrier database for this ID."
  expected_output: >
    If data exists, provide a clean chronological list format (Date | Location | Activity).
    If no data exists, report EXACTLY: "Integration Successful: No records found in the carrier database for this ID."

supervisor_scan_task:
  description: >
    Use the fetch_shipments_by_date tool to retrieve all shipments between 
    {min_date} and {max_date}. Examine the response and filter shipments into 
    categories:
    1. exception_shipments: shipments with status/tag containing Undelivered, 
       Failed delivery, Exception, or similar problem statuses.
    2. return_shipments: shipments with status/tag containing RTO initiated, 
       Return in transit, Returned, or similar return statuses.
    3. delayed_shipments: shipments past their expected delivery date.
    4. stuck_shipments: shipments showing no movement or repeated hub events.
    Do NOT perform deep analysis, delay calculation, or prediction.
    Return a structured JSON with all four categories.
    STRICTLY FORBIDDEN: Do not hallucinate data. Only use real API results.
  expected_output: >
    A JSON object with arrays: {"exception_shipments": [...], "return_shipments": [...], 
    "delayed_shipments": [...], "stuck_shipments": [...]}. 
    Each entry should contain the shipment's tracking_number, tag/status, and key details.

intelligence_analysis_task:
  description: >
    Analyze the following shipment data using the analyze_shipment_intelligence tool.
    Pass the shipment JSON to the tool to compute delay, stuck, and risk indicators.
    Then review the tool's output and provide a detailed human-readable explanation 
    of why this shipment is in its current state. Predict the likely delivery outcome.
    Shipment data: {shipment_data}
    STRICTLY FORBIDDEN: Do not hallucinate or invent analysis data. 
    Use only the tool's computed results for your explanation.
  expected_output: >
    A JSON object with: order_id, status (On-Time/Delayed/Stuck/High Risk), 
    issues (list of detected problems), prediction (Will be delivered / Likely to be returned), 
    and explanation (human-readable reasoning based on tracking patterns).