[project]
name = "shipment"
version = "0.1.0"
description = "shipment using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "certifi>=2026.1.4",
    "crewai[google-genai,tools]==1.9.1",
    "langchain-google-genai>=3.2.0",
    "litellm>=1.75.3",
    "pillow>=12.1.0",
    "pymongo[srv]>=4.16.0",
    "python-barcode>=0.16.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.54.0",
    "streamlit-lottie>=0.0.5",
    "streamlit-option-menu>=0.4.0",
    "mcp[cli]>=1.5.0",
    "httpx>=0.27.0",
    "boto3>=1.42.69",
    "geopy>=2.4.1",
]

[project.scripts]
shipment = "shipment.main:run"
run_crew = "shipment.main:run"
train = "shipment.main:train"
replay = "shipment.main:replay"
test = "shipment.main:test"
run_with_trigger = "shipment.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
